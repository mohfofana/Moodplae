[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unreachable = True

# Ignorer les erreurs de types des bibliothèques externes
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

# Ignorer les dossiers de tests
[mypy-tests.*]
ignore_errors = True

# Configuration spécifique au projet
[mypy-moodplay_phi.*]
check_untyped_defs = True
disallow_untyped_defs = True

# Exceptions
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = False

# Configuration des chemins
[mypy.plugins]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True

# Configuration des rapports
[mypy-report]
files = "."
include_category = True
include_error_code = True
linecount = true
lineprecision = 1

# Configuration des erreurs
[mypy-error]
# Ignorer les erreurs de type génériques
ignore_missing_imports = True

# Configuration des imports
[mypy-import]
# Ignorer les erreurs d'import manquant pour les modules externes
ignore_missing_imports = True
