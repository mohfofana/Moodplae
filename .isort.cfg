[settings]
line_length = 120
include_trailing_comma = true
multi_line_output = 3
known_third_party = numpy,pandas,scipy,sklearn,pydantic,fastapi,uvicorn,spotipy
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
skip = .git,__pycache__,.pytest_cache,.mypy_cache,.venv,venv,env,build,dist
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2

# Configuration spécifique pour les imports relatifs
known_first_party = moodplay_phi

# Ignorer les fichiers de configuration et de cache
skip_glob = 
    *.json
    *.yaml
    *.toml
    *.ini
    *.cfg
    *.txt
    *.md
    *.rst
    *.html
    *.css
    *.js
    */__pycache__/*
    */.pytest_cache/*
    */.mypy_cache/*
    */.venv/*
    */venv/*
    */env/*
    */build/*
    */dist/*

# Configuration des imports multilignes
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2
