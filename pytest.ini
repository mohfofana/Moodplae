[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=moodplay_phi --cov-report=term-missing --cov-report=xml:coverage.xml --benchmark-sort=name
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

[benchmark]
min_rounds = 5
warmup = True
warmup_iterations = 3
disable_gc = True
